[workspace]
resolver = "3"
members = [
  "zkir",
  "zkir-wasm",
]

default-members = [
  "zkir",
]

[workspace.package]
license = "Apache-2.0"
repository = "https://github.com/midnightntwrk/midnight-zkir"

[patch.crates-io]
# Ledger9's optimized packages are not published. Pin exact reviewed source
# commits so CI cannot silently fall back to registry proof implementations.
midnight-curves = { git = "https://github.com/betsudo/midnight-zk.git", rev = "4fcb89a7093362ad0c9922314ef79493e79d487c" }
midnight-circuits = { git = "https://github.com/betsudo/midnight-zk.git", rev = "4fcb89a7093362ad0c9922314ef79493e79d487c" }
midnight-proofs = { git = "https://github.com/betsudo/midnight-zk.git", rev = "4fcb89a7093362ad0c9922314ef79493e79d487c" }
midnight-zk-stdlib = { git = "https://github.com/betsudo/midnight-zk.git", rev = "4fcb89a7093362ad0c9922314ef79493e79d487c" }
midnight-transient-crypto = { git = "https://github.com/betsudo/midnight-ledger.git", rev = "4b2af62d0e5a7967d28109a604bb944686077200" }
midnight-base-crypto = { git = "https://github.com/betsudo/midnight-ledger.git", rev = "4b2af62d0e5a7967d28109a604bb944686077200" }
midnight-base-crypto-derive = { git = "https://github.com/betsudo/midnight-ledger.git", rev = "4b2af62d0e5a7967d28109a604bb944686077200" }
midnight-serialize = { git = "https://github.com/betsudo/midnight-ledger.git", rev = "4b2af62d0e5a7967d28109a604bb944686077200" }
midnight-storage-core = { git = "https://github.com/betsudo/midnight-ledger.git", rev = "4b2af62d0e5a7967d28109a604bb944686077200" }

# The sha3-circuit revision used by zk-stdlib depends on upstream ZK's
# mutable main branch. Bind that git source to the same Ledger9 proof commit.
[patch."https://github.com/midnightntwrk/midnight-zk"]
midnight-proofs = { git = "https://github.com/betsudo/midnight-zk.git", rev = "4fcb89a7093362ad0c9922314ef79493e79d487c" }

[workspace.lints.clippy]
redundant_clone = "warn"
or_fun_call = "warn"

# Used by the nix wasm packaging (bagel.nix); same settings as midnight-ledger.
[profile.wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
