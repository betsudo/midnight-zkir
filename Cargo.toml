[workspace]
resolver = "3"
members = [
  "zkir",
  "zkir-wasm",
]

default-members = [
  "zkir",
]

[workspace.package]
license = "Apache-2.0"
repository = "https://github.com/midnightntwrk/midnight-zkir"

[workspace.lints.clippy]
redundant_clone = "warn"
or_fun_call = "warn"

# Used by the nix wasm packaging (bagel.nix); same settings as midnight-ledger.
[profile.wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

# Release-compatible Ledger9 context graph. These immutable fork sources
# preserve the 0.8.2 key/proof format while adding an opt-in request context.
[patch.crates-io]
midnight-curves = { git = "https://github.com/betsudo/midnight-zk", rev = "c4b67a6bfd8662dfc613b8aef6a1555fc84a374f" }
midnight-proofs = { git = "https://github.com/betsudo/midnight-zk", rev = "c4b67a6bfd8662dfc613b8aef6a1555fc84a374f" }
midnight-zk-stdlib = { git = "https://github.com/betsudo/midnight-zk", rev = "c4b67a6bfd8662dfc613b8aef6a1555fc84a374f" }
midnight-transient-crypto = { git = "https://github.com/betsudo/midnight-ledger", rev = "43ea9d99c81c254059319669b9c2406af173257d" }
midnight-base-crypto = { git = "https://github.com/betsudo/midnight-ledger", rev = "43ea9d99c81c254059319669b9c2406af173257d" }
midnight-base-crypto-derive = { git = "https://github.com/betsudo/midnight-ledger", rev = "43ea9d99c81c254059319669b9c2406af173257d" }
midnight-serialize = { git = "https://github.com/betsudo/midnight-ledger", rev = "43ea9d99c81c254059319669b9c2406af173257d" }
midnight-storage-core = { git = "https://github.com/betsudo/midnight-ledger", rev = "43ea9d99c81c254059319669b9c2406af173257d" }
