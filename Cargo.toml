[workspace]
resolver = "3"
members = [
  "zkir",
  "zkir-wasm",
]

default-members = [
  "zkir",
]

# Fork-only integration pins for the Ledger9 context API. Keep this commit
# separate from the upstream-facing ZKIR source series.
[patch.crates-io]
midnight-transient-crypto = { git = "https://github.com/betsudo/midnight-ledger", rev = "f962e61d404ddf9989d4d798dbf07f4efe278688" }
midnight-base-crypto = { git = "https://github.com/betsudo/midnight-ledger", rev = "f962e61d404ddf9989d4d798dbf07f4efe278688" }
midnight-serialize = { git = "https://github.com/betsudo/midnight-ledger", rev = "f962e61d404ddf9989d4d798dbf07f4efe278688" }
midnight-proofs = { git = "https://github.com/betsudo/midnight-zk", rev = "505156ec0987c98ead6908d5418b9fb827595e2b" }
midnight-zk-stdlib = { git = "https://github.com/betsudo/midnight-zk", rev = "505156ec0987c98ead6908d5418b9fb827595e2b" }
midnight-curves = { git = "https://github.com/betsudo/midnight-zk", rev = "505156ec0987c98ead6908d5418b9fb827595e2b" }

[workspace.package]
license = "Apache-2.0"
repository = "https://github.com/midnightntwrk/midnight-zkir"

[workspace.lints.clippy]
redundant_clone = "warn"
or_fun_call = "warn"

# Used by the nix wasm packaging (bagel.nix); same settings as midnight-ledger.
[profile.wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
