[workspace]
resolver = "3"
members = [
  "zkir",
  "zkir-wasm",
]

default-members = [
  "zkir",
]

[workspace.package]
license = "Apache-2.0"
repository = "https://github.com/midnightntwrk/midnight-zkir"

# Used by the nix wasm packaging (bagel.nix); same settings as midnight-ledger.
[profile.wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

# base-crypto 1.1.0, serialize 1.2.0, and transient-crypto 4.0.0 are not yet
# published to crates.io; resolve them from the midnight-ledger repository, at
# iquerejeta/midnight-zk-unbound-vk (ledger-10 built against the midnight-zk below).
# They all come from the same rev so their interlinked path dependencies unify
# to a single source.
[patch.crates-io]
midnight-base-crypto = { git = "https://github.com/midnightntwrk/midnight-ledger", rev = "adf8f5e787fad6c9c9f1df51a87868e7a52d973e" }
midnight-serialize = { git = "https://github.com/midnightntwrk/midnight-ledger", rev = "adf8f5e787fad6c9c9f1df51a87868e7a52d973e" }
midnight-transient-crypto = { git = "https://github.com/midnightntwrk/midnight-ledger", rev = "adf8f5e787fad6c9c9f1df51a87868e7a52d973e" }
# Not needed for the build itself, but without this transient-crypto pulls
# storage-core (and its macro crates) from crates.io at the same name+version
# as the git copies above, and nix's importCargoLock cannot vendor the same
# name+version from two sources.
midnight-storage-core = { git = "https://github.com/midnightntwrk/midnight-ledger", rev = "adf8f5e787fad6c9c9f1df51a87868e7a52d973e" }
# `UnboundVk` and `AssignedAccumulator::is_collapsed` are not released yet;
# resolve midnight-zk from the head of midnight-zk PR #616 until they ship.
# Spelled with `www.` because Cargo refuses a patch that points to the source
# it patches, as the one below does.
midnight-curves = { git = "https://www.github.com/midnightntwrk/midnight-zk", rev = "17ae77b7cb84ea1b23edfa250be7f9ed61dd694f" }
midnight-proofs = { git = "https://www.github.com/midnightntwrk/midnight-zk", rev = "17ae77b7cb84ea1b23edfa250be7f9ed61dd694f" }
midnight-circuits = { git = "https://www.github.com/midnightntwrk/midnight-zk", rev = "17ae77b7cb84ea1b23edfa250be7f9ed61dd694f" }
midnight-zk-stdlib = { git = "https://www.github.com/midnightntwrk/midnight-zk", rev = "17ae77b7cb84ea1b23edfa250be7f9ed61dd694f" }

# zk-stdlib's sha3 and blake2b circuits depend on midnight-zk by git; unify them
# with the copy above.
[patch."https://github.com/midnightntwrk/midnight-zk"]
midnight-curves = { git = "https://www.github.com/midnightntwrk/midnight-zk", rev = "17ae77b7cb84ea1b23edfa250be7f9ed61dd694f" }
midnight-proofs = { git = "https://www.github.com/midnightntwrk/midnight-zk", rev = "17ae77b7cb84ea1b23edfa250be7f9ed61dd694f" }
midnight-circuits = { git = "https://www.github.com/midnightntwrk/midnight-zk", rev = "17ae77b7cb84ea1b23edfa250be7f9ed61dd694f" }
