[workspace]
resolver = "3"
members = [
  "zkir",
  "zkir-wasm",
]

default-members = [
  "zkir",
]

# Fork-only integration pins for the Ledger9 context API. Keep this commit
# separate from the upstream-facing ZKIR source series.
[patch.crates-io]
midnight-transient-crypto = { git = "https://github.com/betsudo/midnight-ledger", rev = "804c50acfa09312d4cafca763ad760f111e9e471" }
midnight-base-crypto = { git = "https://github.com/betsudo/midnight-ledger", rev = "804c50acfa09312d4cafca763ad760f111e9e471" }
midnight-serialize = { git = "https://github.com/betsudo/midnight-ledger", rev = "804c50acfa09312d4cafca763ad760f111e9e471" }
midnight-proofs = { git = "https://github.com/betsudo/midnight-zk", rev = "6529eaa4e689bb824bd1a4ca6c543cd64f6eb817" }
midnight-zk-stdlib = { git = "https://github.com/betsudo/midnight-zk", rev = "6529eaa4e689bb824bd1a4ca6c543cd64f6eb817" }
midnight-curves = { git = "https://github.com/betsudo/midnight-zk", rev = "6529eaa4e689bb824bd1a4ca6c543cd64f6eb817" }

[workspace.package]
license = "Apache-2.0"
repository = "https://github.com/midnightntwrk/midnight-zkir"

[workspace.lints.clippy]
redundant_clone = "warn"
or_fun_call = "warn"

# Used by the nix wasm packaging (bagel.nix); same settings as midnight-ledger.
[profile.wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
