[workspace]
resolver = "3"
members = [
  "zkir",
  "zkir-wasm",
]

default-members = [
  "zkir",
]

# Fork-only integration pins for the Ledger9 context API. Keep this commit
# separate from the upstream-facing ZKIR source series.
[patch.crates-io]
midnight-transient-crypto = { git = "https://github.com/betsudo/midnight-ledger", rev = "d09c990967cec4c8ac49af48211e70d4f0b98662" }
midnight-base-crypto = { git = "https://github.com/betsudo/midnight-ledger", rev = "d09c990967cec4c8ac49af48211e70d4f0b98662" }
midnight-serialize = { git = "https://github.com/betsudo/midnight-ledger", rev = "d09c990967cec4c8ac49af48211e70d4f0b98662" }
midnight-proofs = { git = "https://github.com/betsudo/midnight-zk", rev = "5f75b85ee5b58046b3fec81ca86d5b95a9140f4a" }
midnight-zk-stdlib = { git = "https://github.com/betsudo/midnight-zk", rev = "5f75b85ee5b58046b3fec81ca86d5b95a9140f4a" }
midnight-curves = { git = "https://github.com/betsudo/midnight-zk", rev = "5f75b85ee5b58046b3fec81ca86d5b95a9140f4a" }

[workspace.package]
license = "Apache-2.0"
repository = "https://github.com/midnightntwrk/midnight-zkir"

[workspace.lints.clippy]
redundant_clone = "warn"
or_fun_call = "warn"

# Used by the nix wasm packaging (bagel.nix); same settings as midnight-ledger.
[profile.wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
